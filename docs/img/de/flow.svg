<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Wann das Modell von selbst wechselt und wann es fragt</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a877f"/></marker></defs>
  <rect width="880" height="260" rx="16" fill="#f6f5f2"/>
  <rect x="30" y="40" width="200" height="70" rx="12" fill="#ffffff" stroke="#d9d6cf"/>
  <text x="130" y="70" font-size="15" font-weight="600" text-anchor="middle" fill="#2b2a27">Deine Nachricht</text>
  <text x="130" y="92" font-size="13" text-anchor="middle" fill="#8a877f">Haiku ordnet sie ein (~1 s)</text>
  <path d="M230 75 H300" stroke="#8a877f" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="300" y="40" width="210" height="70" rx="12" fill="#ffffff" stroke="#d9d6cf"/>
  <text x="405" y="70" font-size="15" font-weight="600" text-anchor="middle" fill="#2b2a27">Erste Nachricht?</text>
  <text x="405" y="92" font-size="13" text-anchor="middle" fill="#8a877f">noch kein Cache</text>
  <path d="M510 60 H590" stroke="#5b8a5a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="550" y="52" font-size="13" text-anchor="middle" fill="#5b8a5a">ja</text>
  <rect x="590" y="30" width="260" height="60" rx="12" fill="#e7f0e6" stroke="#5b8a5a"/>
  <text x="720" y="56" font-size="15" font-weight="600" text-anchor="middle" fill="#2f5a2e">Sofort angewendet</text>
  <text x="720" y="76" font-size="13" text-anchor="middle" fill="#2f5a2e">Modell + Aufwand, ohne Zusatzkosten</text>
  <path d="M405 110 V170 H590" stroke="#d97757" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="420" y="160" font-size="13" fill="#9c3f1f">nein</text>
  <rect x="590" y="140" width="260" height="80" rx="12" fill="#fbe9df" stroke="#d97757"/>
  <text x="720" y="166" font-size="15" font-weight="600" text-anchor="middle" fill="#9c3f1f">Nur Vorschlag</text>
  <text x="720" y="186" font-size="13" text-anchor="middle" fill="#9c3f1f">wenn ein größeres Modell nötig ist,</text>
  <text x="720" y="204" font-size="13" text-anchor="middle" fill="#9c3f1f">mit den Tokens, die es kosten würde</text>
  <text x="30" y="200" font-size="13" fill="#5f5c55">Subagenten starten mit eigenem Kontext,</text>
  <text x="30" y="218" font-size="13" fill="#5f5c55">also können sie ohne Cache-Verlust auf Haiku oder Sonnet laufen.</text>
</svg>
